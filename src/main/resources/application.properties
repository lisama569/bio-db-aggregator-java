# Local rule-set declaration locations (no network). classpath*: scans every root
# (main + test) on the classpath; local directories may be appended, e.g.
# aggregator.rules.locations[0]=classpath*:rules/
# aggregator.rules.locations[1]=/etc/bio-aggregator/rules
aggregator.rules.locations[0]=classpath*:rules/

# Rule set activated at startup (must exist after scanning); empty => keep the
# previously active one, else fall back to priority-rules-v1, else the lexicographically
# first loaded id.
aggregator.rules.active=

# Legacy fallback CSV used only when the resolver is instantiated directly (unit tests).
aggregator.source-priority=refseq,uniprot,ensembl,genbank,ncbi
